[project]
name = "agent"
version = "0.1.0"
description = "LangGraph support-desk agent orchestrator (MCP client + RAG HTTP client)"
authors = [{ name = "support-desk" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langgraph>=0.3.0",
]

[tool.poetry]
packages = [{ include = "agent", from = "src" }]

[tool.poetry.scripts]
agent = "agent.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.0"
