[project]
name = "rag"
version = "0.1.0"
description = "RAG pipeline service for policy Q&A (skeleton)"
authors = [{ name = "support-desk" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[tool.poetry]
packages = [{ include = "rag", from = "src" }]

[tool.poetry.scripts]
rag = "rag.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.0"
