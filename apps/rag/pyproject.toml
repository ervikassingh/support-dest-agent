[project]
name = "rag"
version = "0.1.0"
description = "RAG ingest, hybrid search, and evals"
authors = [{ name = "support-desk" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "psycopg[binary,pool] (>=3.2.0)",
    "pgvector (>=0.3.6)",
    "pypdf (>=5.1.0)",
    "python-docx (>=1.1.2)",
    "beautifulsoup4 (>=4.12.0)",
    "markdownify (>=0.14.1)",
    "tiktoken (>=0.8.0)",
    "bullmq (>=2.16.0)",
    "fpdf2 (>=2.8.0)",
    "ragas (>=0.2.0)",
    "langsmith (>=0.3.0)",
    "langchain-openai (>=0.3.0)",
    "langchain-core (>=0.3.0)",
]

[tool.poetry]
packages = [{ include = "rag", from = "src" }]

[tool.poetry.scripts]
rag = "rag.main:run"
rag-worker = "rag.worker:run"
rag-reindex = "rag.reindex:main"
rag-seed = "rag.seed:main"
rag-golden = "rag.evals.golden:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.0"
pytest = "^8.3.0"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
